<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f151d"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#1f2a37" stroke-width="2"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1f2a37" stroke-width="1" opacity="0.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Hierarchy tree connectors -->
  <g stroke="#3d4d5f" stroke-width="6" fill="none">
    <path d="M256 168 L256 216"/>
    <path d="M256 216 L156 296"/>
    <path d="M256 216 L256 296"/>
    <path d="M256 216 L356 296"/>
    <path d="M156 296 L156 344"/>
    <path d="M256 296 L256 344"/>
    <path d="M356 296 L356 344"/>
  </g>

  <!-- Root node -->
  <rect x="216" y="128" width="80" height="56" rx="14" fill="url(#nodeGrad)"/>
  <rect x="216" y="128" width="80" height="56" rx="14" fill="none" stroke="#0a0e14" stroke-width="3"/>

  <!-- Child nodes -->
  <rect x="116" y="296" width="80" height="56" rx="12" fill="#161d27" stroke="#38bdf8" stroke-width="4"/>
  <rect x="216" y="296" width="80" height="56" rx="12" fill="#161d27" stroke="#22c55e" stroke-width="4"/>
  <rect x="316" y="296" width="80" height="56" rx="12" fill="#161d27" stroke="#f59e0b" stroke-width="4"/>

  <!-- Leaf indicators (wrench dots) -->
  <circle cx="156" cy="324" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="324" r="6" fill="#22c55e"/>
  <circle cx="356" cy="324" r="6" fill="#f59e0b"/>
</svg>
